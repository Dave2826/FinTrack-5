# Operaciones GraphQL de la Actividad 5: configuración de permisos.
# Todas usan el fragmento DatosPermiso y las variables de variables/*.json
# (actor Ana Torres: company_user 29, empresa 5).

fragment DatosPermiso on Permission {
  id
  code
  name
  description
  isActive
}

# E02: catálogo completo (sin filtro) y por recurso (enum PermissionResource).
# variables/explorar_catalogo_completo.json       -> recurso omitido (null)
# variables/explorar_catalogo_<recurso>.json      -> uno de los 5 recursos
query ExplorarCatalogo($actorCompanyUserId: ID!, $recurso: PermissionResource) {
  todos: permissionCatalog(actorCompanyUserId: $actorCompanyUserId) {
    ...DatosPermiso
  }
  porRecurso: permissionCatalog(
    actorCompanyUserId: $actorCompanyUserId
    resource: $recurso
  ) {
    ...DatosPermiso
  }
}

# E03: previsualización de la propuesta completa; solo lectura.
query RevisarConfiguracion(
  $input: SetRolePermissionsInput!
  $actorCompanyUserId: ID!
) {
  previewRolePermissions(input: $input, actorCompanyUserId: $actorCompanyUserId) {
    role {
      id
      code
      name
    }
    current {
      id
      code
    }
    toActivate {
      id
      code
    }
    toDeactivate {
      id
      code
    }
    unchanged {
      id
      code
    }
    finalCount
  }
}

# E04/E05/E08/E09: aplicación exacta en una única transacción.
mutation AplicarConfiguracion(
  $input: SetRolePermissionsInput!
  $actorCompanyUserId: ID!
) {
  setRolePermissions(input: $input, actorCompanyUserId: $actorCompanyUserId) {
    role {
      id
      code
      name
    }
    activated {
      id
      code
    }
    deactivated {
      id
      code
    }
    unchanged {
      id
      code
    }
    finalCount
    changed
  }
}
