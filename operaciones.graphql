# Operaciones GraphQL de la Actividad 5: configuración de permisos.
# Todas usan el fragmento DatosPermiso y las variables de variables/*.json.
# Contrato autenticado (Actividad 6): la identidad (Ana Torres, empresa 5)
# viaja en el encabezado Authorization: Bearer <token>; las operaciones
# ya no reciben actorCompanyUserId.

fragment DatosPermiso on Permission {
  id
  code
  name
  description
  isActive
}

# E02: catálogo completo (sin filtro) y por recurso (enum PermissionResource).
# variables/explorar_catalogo_completo.json       -> recurso omitido (null)
# variables/explorar_catalogo_<recurso>.json      -> uno de los 5 recursos
query ExplorarCatalogo($recurso: PermissionResource) {
  todos: permissionCatalog {
    ...DatosPermiso
  }
  porRecurso: permissionCatalog(resource: $recurso) {
    ...DatosPermiso
  }
}

# E03: previsualización de la propuesta completa; solo lectura.
query RevisarConfiguracion($input: SetRolePermissionsInput!) {
  previewRolePermissions(input: $input) {
    role {
      id
      code
      name
    }
    current {
      id
      code
    }
    toActivate {
      id
      code
    }
    toDeactivate {
      id
      code
    }
    unchanged {
      id
      code
    }
    finalCount
  }
}

# E04/E05/E08/E09: aplicación exacta en una única transacción.
mutation AplicarConfiguracion($input: SetRolePermissionsInput!) {
  setRolePermissions(input: $input) {
    role {
      id
      code
      name
    }
    activated {
      id
      code
    }
    deactivated {
      id
      code
    }
    unchanged {
      id
      code
    }
    finalCount
    changed
  }
}

# ---------------------------------------------------------------------------
# Actividad 7: balances por cuenta y balance general (solo lectura).
# La empresa se obtiene del token; companyId es un campo de salida de
# generalBalance, nunca un argumento. Las variables de ejemplo estan en
# variables_actividad7/balance_cuenta.json y balance_general.json.
# ---------------------------------------------------------------------------

query BalanceCuenta(
  $accountId: ID!
  $fromDate: Date!
  $toDate: Date!
) {
  accountBalance(
    accountId: $accountId
    fromDate: $fromDate
    toDate: $toDate
  ) {
    accountId
    accountName
    isActive
    openingBalance
    totalIncome
    totalExpense
    profit
    closingBalance
    isInRed
    currency
  }
}

query BalanceGeneral(
  $fromDate: Date!
  $toDate: Date!
) {
  generalBalance(fromDate: $fromDate, toDate: $toDate) {
    companyId
    fromDate
    toDate
    openingBalance
    totalIncome
    totalExpense
    profit
    closingBalance
    accountsInRed
    isInRed
    currency
    accounts {
      accountId
      accountName
      isActive
      openingBalance
      totalIncome
      totalExpense
      profit
      closingBalance
      isInRed
      currency
    }
  }
}
