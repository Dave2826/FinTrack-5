# Operaciones GraphQL de la Actividad 6: control de acceso segun el rol.
# La identidad viaja en el encabezado Authorization: Bearer <token>;
# ninguna operacion protegida recibe actorCompanyUserId.

# Login publico (email + contrasena) contra la base de pruebas.
# Respuesta AuthPayload: token JWT, tokenType y datos minimos del usuario.
mutation IniciarSesion($input: LoginInput!) {
  login(input: $input) {
    token
    tokenType
    user {
      id
      name
    }
  }
}

# Casos 2/5/7: consulta de cuentas de la empresa del token.
query ConsultarCuentas($companyId: Int!) {
  accounts(companyId: $companyId) {
    id
    name
    accountType
    isActive
  }
}

# Casos 1/3/4: escritura de cuenta (permiso accounts.write).
mutation CrearCuenta($input: CreateAccountInput!) {
  createAccount(input: $input) {
    id
    companyId
    name
    accountType
  }
}

# Casos 5/7/9: registro de movimiento (permiso transactions.write).
mutation CrearMovimiento($input: CreateTransactionInput!) {
  createTransaction(input: $input) {
    id
    accountId
    conceptId
    capturedBy
    amount
    transactionType
  }
}

# Casos 6/7: cambio de rol de una membresia (permiso roles.write).
mutation CambiarRol($input: AssignRoleInput!) {
  assignRole(input: $input) {
    id
    companyUserId
    roleId
    isActive
  }
}
